<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기 - D2RPvP</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2a2d21 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            font-size: 1.2rem;
            color: #ccc;
        }

        /* 계산기 카테고리 탭 */
        .calculator-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: bold;
        }

        .tab-btn:hover, .tab-btn.active {
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        /* 계산기 섹션 */
        .calculator-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #ffd700;
            text-align: center;
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2rem;
        }

        .result-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2rem;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ffd700;
            font-weight: bold;
        }

        .input-field, .input-select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 1rem;
        }

        .input-field:focus, .input-select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2);
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .calculate-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .result-display {
            text-align: center;
            padding: 2rem;
        }

        .result-value {
            font-size: 3rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 1rem;
        }

        .result-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            color: #ccc;
        }

        .detail-value {
            color: #ffd700;
            font-weight: bold;
        }

        /* 시뮬레이터 특별 스타일 */
        .simulator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .character-title {
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 1rem;
            text-align: center;
        }

        .vs-section {
            text-align: center;
            margin: 2rem 0;
        }

        .vs-text {
            font-size: 2rem;
            color: #ff6b6b;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .simulation-result {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .win-probability {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 1rem;
        }

        .probability-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .probability-fill {
            height: 100%;
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            transition: width 0.5s ease;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }

            .simulator-grid {
                grid-template-columns: 1fr;
            }

            .input-row {
                grid-template-columns: 1fr;
            }

            .calculator-tabs {
                flex-direction: column;
                align-items: center;
            }

            .tab-btn {
                width: 100%;
                max-width: 300px;
            }
        }

        /* 숨김 처리 */
        .hidden {
            display: none;
        }

        /* 아이콘 스타일 */
        .section-icon {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 1rem;
        }

        .help-text {
            font-size: 0.9rem;
            color: #999;
            margin-top: 0.5rem;
            font-style: italic;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calculator-section {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 페이지 헤더 -->
        <div class="page-header">
            <h1 class="page-title">계산기 도구</h1>
            <p class="page-subtitle">PvP 전략을 위한 다양한 계산 도구</p>
        </div>

        <!-- 계산기 탭 -->
        <div class="calculator-tabs">
            <button class="tab-btn active" onclick="showCalculator('power')">파워점수 계산기</button>
            <button class="tab-btn" onclick="showCalculator('elo')">ELO 점수 예상</button>
            <button class="tab-btn" onclick="showCalculator('simulator')">시뮬레이터</button>
            <button class="tab-btn" onclick="showCalculator('ring')">링 스탯 측정</button>
        </div>

        <!-- 파워점수 계산기 -->
        <div id="power-calculator" class="calculator-section">
            <h2 class="section-title">
                <i class="fas fa-bolt section-icon"></i>
                파워점수 계산기
            </h2>
            <div class="calculator-grid">
                <div class="input-section">
                    <div class="input-group">
                        <label class="input-label">캐릭터 레벨</label>
                        <input type="number" class="input-field" id="characterLevel" placeholder="예: 85" min="1" max="99">
                        <div class="help-text">캐릭터의 현재 레벨을 입력하세요</div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label class="input-label">힘 (STR)</label>
                            <input type="number" class="input-field" id="strength" placeholder="예: 200">
                        </div>
                        <div class="input-group">
                            <label class="input-label">민첩 (DEX)</label>
                            <input type="number" class="input-field" id="dexterity" placeholder="예: 150">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label class="input-label">체력 (VIT)</label>
                            <input type="number" class="input-field" id="vitality" placeholder="예: 100">
                        </div>
                        <div class="input-group">
                            <label class="input-label">에너지 (ENE)</label>
                            <input type="number" class="input-field" id="energy" placeholder="예: 50">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">무기 데미지</label>
                        <input type="number" class="input-field" id="weaponDamage" placeholder="예: 350">
                    </div>
                    <button class="calculate-btn" onclick="calculatePowerScore()">파워점수 계산</button>
                </div>
                <div class="result-section">
                    <div class="result-display">
                        <div class="result-value" id="powerResult">0</div>
                        <div>파워점수</div>
                    </div>
                    <div class="result-details">
                        <div class="detail-item">
                            <span class="detail-label">기본 점수</span>
                            <span class="detail-value" id="baseScore">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">레벨 보너스</span>
                            <span class="detail-value" id="levelBonus">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">스탯 보너스</span>
                            <span class="detail-value" id="statBonus">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">무기 보너스</span>
                            <span class="detail-value" id="weaponBonus">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ELO 점수 계산기 -->
        <div id="elo-calculator" class="calculator-section hidden">
            <h2 class="section-title">
                <i class="fas fa-chart-line section-icon"></i>
                ELO 점수 예상 계산기
            </h2>
            <div class="calculator-grid">
                <div class="input-section">
                    <div class="input-group">
                        <label class="input-label">현재 ELO 점수</label>
                        <input type="number" class="input-field" id="currentElo" placeholder="예: 1500">
                    </div>
                    <div class="input-group">
                        <label class="input-label">상대방 ELO 점수</label>
                        <input type="number" class="input-field" id="opponentElo" placeholder="예: 1600">
                    </div>
                    <div class="input-group">
                        <label class="input-label">경기 결과</label>
                        <select class="input-select" id="gameResult">
                            <option value="">선택하세요</option>
                            <option value="win">승리</option>
                            <option value="lose">패배</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">K-Factor</label>
                        <input type="number" class="input-field" id="kFactor" placeholder="32" value="32">
                        <div class="help-text">일반적으로 32를 사용합니다</div>
                    </div>
                    <button class="calculate-btn" onclick="calculateElo()">ELO 점수 계산</button>
                </div>
                <div class="result-section">
                    <div class="result-display">
                        <div class="result-value" id="eloResult">0</div>
                        <div>예상 ELO 점수</div>
                    </div>
                    <div class="result-details">
                        <div class="detail-item">
                            <span class="detail-label">점수 변화</span>
                            <span class="detail-value" id="eloChange">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">승률 예상</span>
                            <span class="detail-value" id="winProbability">0%</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">점수 차이</span>
                            <span class="detail-value" id="eloDifference">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 시뮬레이터 -->
        <div id="simulator-calculator" class="calculator-section hidden">
            <h2 class="section-title">
                <i class="fas fa-gamepad section-icon"></i>
                PvP 시뮬레이터
            </h2>
            <div class="simulator-grid">
                <div class="character-card">
                    <h3 class="character-title">내 캐릭터</h3>
                    <div class="input-group">
                        <label class="input-label">캐릭터 타입</label>
                        <select class="input-select" id="myCharType">
                            <option value="barb">바바리안</option>
                            <option value="paladin">팔라딘</option>
                            <option value="amazon">아마존</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">파워점수</label>
                        <input type="number" class="input-field" id="myPowerScore" placeholder="예: 2500">
                    </div>
                    <div class="input-group">
                        <label class="input-label">ELO 점수</label>
                        <input type="number" class="input-field" id="myEloScore" placeholder="예: 1600">
                    </div>
                </div>
                <div class="character-card">
                    <h3 class="character-title">상대 캐릭터</h3>
                    <div class="input-group">
                        <label class="input-label">캐릭터 타입</label>
                        <select class="input-select" id="opponentCharType">
                            <option value="barb">바바리안</option>
                            <option value="paladin">팔라딘</option>
                            <option value="amazon">아마존</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label class="input-label">파워점수</label>
                        <input type="number" class="input-field" id="opponentPowerScore" placeholder="예: 2400">
                    </div>
                    <div class="input-group">
                        <label class="input-label">ELO 점수</label>
                        <input type="number" class="input-field" id="opponentEloScore" placeholder="예: 1550">
                    </div>
                </div>
            </div>
            <div class="vs-section">
                <div class="vs-text">VS</div>
                <button class="calculate-btn" onclick="runSimulation()">시뮬레이션 실행</button>
            </div>
            <div class="simulation-result">
                <div class="win-probability" id="simulationResult">승률 계산중...</div>
                <div class="probability-bar">
                    <div class="probability-fill" id="probabilityBar" style="width: 0%"></div>
                </div>
                <div class="result-details">
                    <div class="detail-item">
                        <span class="detail-label">예상 승률</span>
                        <span class="detail-value" id="winRate">0%</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">승리 시 점수 변화</span>
                        <span class="detail-value" id="winPoints">+0</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">패배 시 점수 변화</span>
                        <span class="detail-value" id="losePoints">-0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 링 스탯 측정기 -->
        <div id="ring-calculator" class="calculator-section hidden">
            <h2 class="section-title">
                <i class="fas fa-ring section-icon"></i>
                링 스탯 측정기
            </h2>
            <div class="calculator-grid">
                <div class="input-section">
                    <div class="input-group">
                        <label class="input-label">링 타입</label>
                        <select class="input-select" id="ringType">
                            <option value="">선택하세요</option>
                            <option value="rare">레어 링</option>
                            <option value="unique">유니크 링</option>
                            <option value="set">세트 링</option>
                        </select>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label class="input-label">힘 증가</label>
                            <input type="number" class="input-field" id="ringStr" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label class="input-label">민첩 증가</label>
                            <input type="number" class="input-field" id="ringDex" placeholder="0">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label class="input-label">체력 증가</label>
                            <input type="number" class="input-field" id="ringVit" placeholder="0">
                        </div>
                        <div class="input-group">
                            <label class="input-label">에너지 증가</label>
                            <input type="number" class="input-field" id="ringEne" placeholder="0">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">생명력 증가</label>
                        <input type="number" class="input-field" id="ringLife" placeholder="0">
                    </div>
                    <div class="input-group">
                        <label class="input-label">마나 증가</label>
                        <input type="number" class="input-field" id="ringMana" placeholder="0">
                    </div>
                    <button class="calculate-btn" onclick="calculateRingValue()">링 가치 계산</button>
                </div>
                <div class="result-section">
                    <div class="result-display">
                        <div class="result-value" id="ringValue">0</div>
                        <div>링 가치 점수</div>
                    </div>
                    <div class="result-details">
                        <div class="detail-item">
                            <span class="detail-label">스탯 점수</span>
                            <span class="detail-value" id="statScore">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">생명력 점수</span>
                            <span class="detail-value" id="lifeScore">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">마나 점수</span>
                            <span class="detail-value" id="manaScore">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">등급</span>
                            <span class="detail-value" id="ringGrade">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showCalculator(type) {
            // 모든 탭 비활성화
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.calculator-section').forEach(section => section.classList.add('hidden'));
            
            // 선택된 탭 활성화
            event.target.classList.add('active');
            document.getElementById(type + '-calculator').classList.remove('hidden');
        }

        function calculatePowerScore() {
            const level = parseInt(document.getElementById('characterLevel').value) || 0;
            const str = parseInt(document.getElementById('strength').value) || 0;
            const dex = parseInt(document.getElementById('dexterity').value) || 0;
            const vit = parseInt(document.getElementById('vitality').value) || 0;
            const ene = parseInt(document.getElementById('energy').value) || 0;
            const weaponDmg = parseInt(document.getElementById('weaponDamage').value) || 0;

            const baseScore = level * 10;
            const levelBonus = level > 80 ? (level - 80) * 5 : 0;
            const statBonus = (str + dex + vit + ene) * 0.5;
            const weaponBonus = weaponDmg * 2;

            const totalScore = baseScore + levelBonus + statBonus + weaponBonus;

            document.getElementById('powerResult').textContent = Math.round(totalScore);
            document.getElementById('baseScore').textContent = baseScore;
            document.getElementById('levelBonus').textContent = levelBonus;
            document.getElementById('statBonus').textContent = Math.round(statBonus);
            document.getElementById('weaponBonus').textContent = weaponBonus;
        }

        function calculateElo() {
            const currentElo = parseInt(document.getElementById('currentElo').value) || 1500;
            const opponentElo = parseInt(document.getElementById('opponentElo').value) || 1500;
            const result = document.getElementById('gameResult').value;
            const kFactor = parseInt(document.getElementById('kFactor').value) || 32;

            const expectedScore = 1 / (1 + Math.pow(10, (opponentElo - currentElo) / 400));
            const actualScore = result === 'win' ? 1 : (result === 'lose' ? 0 : 0.5);
            const eloChange = Math.round(kFactor * (actualScore - expectedScore));
            const newElo = currentElo + eloChange;

            document.getElementById('eloResult').textContent = newElo;
            document.getElementById('eloChange').textContent = eloChange > 0 ? '+' + eloChange : eloChange;
            document.getElementById('winProbability').textContent = Math.round(expectedScore * 100) + '%';
            document.getElementById('eloDifference').textContent = opponentElo - currentElo;
        }

        function runSimulation() {
            const myPower = parseInt(document.getElementById('myPowerScore').value) || 2000;
            const opponentPower = parseInt(document.getElementById('opponentPowerScore').value) || 2000;
            const myElo = parseInt(document.getElementById('myEloScore').value) || 1500;
            const opponentElo = parseInt(document.getElementById('opponentEloScore').value) || 1500;

            // 간단한 승률 계산 (파워점수와 ELO 점수 기반)
            const powerDiff = myPower - opponentPower;
            const eloDiff = myElo - opponentElo;
            
            let winRate = 50 + (powerDiff / 100) + (eloDiff / 40);
            winRate = Math.max(5, Math.min(95, winRate)); // 5-95% 범위로 제한

            const winPoints = Math.round(32 * (1 - winRate / 100));
            const losePoints = Math.round(-32 * (winRate / 100));

            document.getElementById('simulationResult').textContent = Math.round(winRate) + '% 승률';
            document.getElementById('probabilityBar').style.width = winRate + '%';
            document.getElementById('winRate').textContent = Math.round(winRate) + '%';
            document.getElementById('winPoints').textContent = '+' + winPoints;
            document.getElementById('losePoints').textContent = losePoints;
        }

        function calculateRingValue() {
            const str = parseInt(document.getElementById('ringStr').value) || 0;
            const dex = parseInt(document.getElementById('ringDex').value) || 0;
            const vit = parseInt(document.getElementById('ringVit').value) || 0;
            const ene = parseInt(document.getElementById('ringEne').value) || 0;
            const life = parseInt(document.getElementById('ringLife').value) || 0;
            const mana = parseInt(document.getElementById('ringMana').value) || 0;

            const statScore = (str + dex + vit + ene) * 2;
            const lifeScore = life * 0.5;
            const manaScore = mana * 0.3;
            const totalValue = statScore + lifeScore + manaScore;

            let grade = '하급';
            if (totalValue > 200) grade = '최상급';
            else if (totalValue > 150) grade = '상급';
            else if (totalValue > 100) grade = '중급';

            document.getElementById('ringValue').textContent = Math.round(totalValue);
            document.getElementById('statScore').textContent = statScore;
            document.getElementById('lifeScore').textContent = Math.round(lifeScore);
            document.getElementById('manaScore').textContent = Math.round(manaScore);
            document.getElementById('ringGrade').textContent = grade;
        }
    </script>
</body>
